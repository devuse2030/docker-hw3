services:
  app:
    build: .
    user: "10001:10001"
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    ports:
      - "127.0.0.1:${HOST_PORT:-8081}:8000"
    environment:
      PORT: "8000"
      GREETING: "${GREETING:-Hello, Docker!}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    stop_grace_period: 30s
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli ping)\" = PONG"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  redis_data:
